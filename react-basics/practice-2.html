<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container);
    function LoginForm(){
        return(
            <div>
                <div>
                    <input placeholder="Email" size ="20"/>
                </div>
                <div>
                    <input placeholder="Password" size ="20" type="password"/>
                </div>
                <div>
                    <button>Login</button>
                    <button>SignUp</button>
                </div>
            </div>
        );
    }

    function ProductDetails({itemName, price, discountPrice, imgsrc}){
        console.log(discountPrice);
        return (
            <>
                <img src= {`https://supersimple.dev/images/${imgsrc}.png`} width="100"/>
                <div>{itemName}</div>
                {discountPrice ? (
                    <>
                        <div><del>Price: ${price}</del></div>
                        <div>Discount Price: ${discountPrice}</div>
                    </>
                ):(
                    <>
                        <div>Price: ${price}</div>
                    </>
                )}
                <div><button>Add To Cart</button></div>
                
            </>
        );
    }

    function App(){
        return (
            <>
                Hello, welcome to my website
                <LoginForm />
                <ProductDetails itemName="Cotton Socks" price="10.90" discountPrice="5.45" imgsrc="cotton-socks"/>
                <ProductDetails itemName="Tennis balls" price="6.00" imgsrc="tennis-balls"/>
                <ProductDetails itemName="Plain T-Shirt" price="7.99" imgsrc="plain-t-shirt"/>
            </>
        );
    }
    root.render(<App />);
    </script>
</body>
</html>
