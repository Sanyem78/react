<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);
        
        function CounterButton({counter, setCounter}){

            function buttonAction(){
                setCounter(counter+1);
            }

            return(
                <>
                    <button onClick={buttonAction}>Clicked {counter} {counter === 0 || counter === 1 ? "time" : "times"}</button>
                </>
            );
        }

        function ResetButton({setCounter}){
            function resetAction(){
                setCounter(0);
            }
            return(
                <>
                    <button onClick={resetAction}>Reset</button>
                </>
            );
        }

        function InputTextBox(){
            const [inputText, setInputText] = React.useState("");
            const [submittedText, setSubmittedText] = React.useState("");
            
            function inputAction(event){
                setInputText(event.target.value);
            }

            function resetAction(){
                setInputText("");
            }

            function exampleAction(){
                setInputText("Sanyem");
            }

            function enterAction(event){
                if(event.key === "Enter"){
                    setSubmittedText(inputText);
                    setInputText("");
                }
                else if(event.key === "Escape"){
                    setSubmittedText("");
                    
                    setInputText("");
                }
            }

            return(
                <div>
                    <input onChange={inputAction} placeholder="Enter your text" size="50" value={inputText} onKeyDown={enterAction}></input>
                    <button onClick={resetAction}>Reset</button>
                    <button onClick={exampleAction}>Example</button>
                    <div>Hello {inputText}</div>
                    <div>Whatsup? {submittedText}</div>
                </div>
            );
        }

        function App(){
            const [counter, setCounter] = React.useState(0);

            return (
                <>
                    <CounterButton counter={counter} setCounter={setCounter}/>
                    <CounterButton counter={counter} setCounter={setCounter}/>
                    <ResetButton setCounter={setCounter}/>
                    <InputTextBox />
                </>
            );
        }
        root.render(<App />);
    </script>
</body>
</html>
