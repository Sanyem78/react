<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        body{
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .send-button{
            background-color: rgb(25,135,84);
            color: white;
            border: none;
            padding: 12px 20px;
            margin-left: 10px;
            border-radius: 10px;
            font-size: large;
            cursor: pointer;
        }

        .input-text{
            padding: 12px 20px;
            border-radius: 10px;
            font-size: large;
            border-width: 1px;
            flex-grow:1
        }

        .chat-input-container{
            display: flex;
            margin-bottom: 20px;
        }

        .app-container{
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            /* in order to give the app height as a browser height vh is used */
            height: 100vh;
            display: flex;

            /* flex by default put every component horizontally to fix this we use this */
            flex-direction: column;
        }

        .chat-user-container{
            display: flex;
            /* justify-content moves the element horizontally */
            justify-content: end;
            margin-top: 10px;
            /* align-items moves the element vertically */
            align-items: start;

        }

        .chat-robot-container{
            display: flex;
            justify-content: left;
            align-items: start;
            max-width: 400px;
        }

        .chat-message{
            background-color: rgba(238, 238, 238);
            border-radius: 10px;
            padding: 20px 10px;
            margin-right: 10px;
            margin-left: 10px;
            margin-top: 15px;
        }

        .user-image{
            margin-top:15px;
            width: 50px;
        }
        .robot-image{
            margin-top:20px;
            width: 50px;
        }

        .chat-messages{
            flex-grow: 1;
            margin-top: 20px;
            margin-bottom: 10px;
            scrollbar-width: none;
            /* when there will be lots of messages scroll will activate */
            overflow: scroll;
        }

    </style>
</head>
<body>
    <div class="js-container"></div>
   
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        const container = document.querySelector('.js-container');
        const root = ReactDOM.createRoot(container);

        function ChatInput({chatMessages,setChatMessages}){

            const [inputText, setInputText] = React.useState("");
            const [isLoading, setIsLoading] = React.useState(false);

            function saveInputText(event){
                setInputText(
                    event.target.value
                );
            }

            async function sendMessage(){
                
                if(inputText === "") return;
                if(isLoading) return;

                setIsLoading(true);
                const originalInputText = inputText;
                setInputText("");

                const tempId = crypto.randomUUID();

                const newChatMessages = [
                    ...chatMessages,
                    {
                        message: originalInputText,
                        sender: "user",
                        id: crypto.randomUUID()
                    },
                    {
                        message: "Loading...",
                        sender: "robot",
                        id: tempId
                    }
                ]

                setChatMessages(newChatMessages);

                const response = await Chatbot.getResponseAsync(originalInputText)
               
                setChatMessages(prev=>[
                    ...prev.filter(message => message.id !== tempId),
                    {
                        message: response,
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);
 

                // const response = Chatbot.getResponse(inputText);
                // console.log(response);
                setIsLoading(false);
                
            }

            function enterAction(event){
                if(event.key === "Enter" && inputText !== ""){
                    sendMessage();
                }
                else if (event.key === "Escape"){
                    setInputText("");
                }
            }

            return (
                <div className="chat-input-container">
                    <input 
                        className="input-text"
                        placeholder="Send a message to Chatbot" 
                        size="50"
                        onChange={saveInputText}
                        value={inputText}
                        onKeyDown={enterAction}
                    />
                    <button 
                        onClick={sendMessage} 
                        disabled={isLoading}
                        className="send-button"
                    >
                       {isLoading ? "Loading.." : "Send"}    
                    </button>
                    
                </div>
            )
        }

        function ChatMessage({message, sender}){            
            return(
                <div className={sender === "robot"? "chat-robot-container": "chat-user-container"}>
                    {sender === "robot" && (
                        <img className="robot-image" src="static/robot.png"/>
                    )}
                    <div className="chat-message">{message}</div>
                    {sender === "user" && (
                        <img className="user-image" src="static/user-profile.png"/>
                    )}
                </div>
            )
        }

        function ChatMessages({chatMessages}){

            const chatMessagesRef = React.useRef(null);

            React.useEffect(()=>{
                
                const containerElem = chatMessagesRef.current;
                if(containerElem){
                    containerElem.scrollTop = containerElem.scrollHeight;
                }

            },[chatMessages]);

            return(
                <div className="chat-messages" ref={chatMessagesRef}>
                    {
                        chatMessages.map((chatMessage)=>{
                        return (
                            <ChatMessage 
                                message={chatMessage.message} 
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                </div>
            );
        }

        function App(){
            const [chatMessages, setChatMessages] = React.useState([{
                    message: "Hello Chatbot",
                    sender: "user",
                    id: "1"
                },{
                    message: "Hello User, Whatsup?",
                    sender: "robot",
                    id: "2"
                },{
                    message: "What is todays date?",
                    sender: "user",
                    id: "3"
                },{
                    message: "Todays date is 6th June 2026",
                    sender: "robot",
                    id: "4"
                }]);

            return (
                <div className="app-container">  
                    <ChatMessages 
                        chatMessages={chatMessages}
                    /> 
                    <ChatInput 
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                </div>
            );
        }

        root.render(<App />);
    </script>
</body>
</html>
